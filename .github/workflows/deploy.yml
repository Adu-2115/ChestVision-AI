name: ChestVision CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # lets the Docker/Render jobs below be run by hand

jobs:

  # ── 1. Test frontend build ───────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --watchAll=false
        env:
          CI: true

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          CI: false   # treat warnings as warnings, not errors

  # ── 2. Test backend ──────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      # The tests import the real model and API code, so they need the full
      # backend requirements. CPU-only torch keeps the install small.
      - name: Install dependencies
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt httpx

      # The backend creates its upload and report folders when imported.
      # The default (/app) only exists inside the Docker image.
      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
        env:
          BASE_DIR: ${{ runner.temp }}/chestvision

  # ── 3. Build & push Docker image ────────────────────────
  # Manual only. This job cannot succeed as written: it builds from ./backend,
  # which has no Dockerfile, and the live backend is deployed to Hugging Face
  # from the separate chessvision-api repository, not from Docker Hub.
  build-push:
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chessvision-api:latest
            ${{ secrets.DOCKER_USERNAME }}/chessvision-api:${{ github.sha }}

  # ── 4. Deploy backend → Render ──────────────────────────
  # Manual only, for the same reason: the live backend is not on Render.
  deploy-backend:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -fsSX POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "✓ Render deploy triggered"

  # ── 5. Frontend deployment ───────────────────────────────
  # No job here on purpose. Vercel's GitHub integration builds and deploys the
  # frontend on every push to main. The old job used amondnet/vercel-action@v25,
  # whose bundled Vercel CLI is too old for the current Vercel API, and it
  # would have deployed the same commit a second time.
