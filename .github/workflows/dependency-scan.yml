name: Dependency Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'backend/requirements.txt'
  pull_request:
    branches: [main]
  schedule:
    # Also run weekly even without a push — new CVEs get discovered in
    # already-pinned packages all the time, not just when you change requirements.txt
    - cron: '0 6 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt --desc || true
        # `|| true` keeps this from hard-failing the whole workflow on
        # first setup — remove it once you've triaged any existing findings
        # and want new vulnerabilities to actually block merges.
